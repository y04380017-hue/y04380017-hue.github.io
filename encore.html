 if(a==='sim-yes'||a==='sim-withdraw'){act('RSVP',{personId:b.dataset.person,yes:a==='sim-yes'});return}
 if(a==='mutual'){act('MUTUAL',{personId:'zhoumo',yes:!state().mutualResponses.zhoumo});return}
 if(a==='invite-format'){act('INVITE_FORMAT',{kind:b.dataset.kind});return}
 if(a==='scan-group'||a==='scan-event'){var r=act('SCAN',{kind:a==='scan-group'?'group':'event',invitationId:b.dataset.invite,eventId:b.dataset.event});if(r.ok){if($('#modal').open)closeModal();$('#presenter').close();openedEvent=null;nav('collection');toast('签到成功，新的一场也有了自己的纪念。')}return}
 if(a==='toggle-view'){act('VIEW',{view:state().view==='host'?'guest':'host'});scrollTo({top:0,behavior:'instant'});return}
 if(a==='send-next'||a==='reschedule'){openModal(a==='send-next'?'send':'reschedule',{invitationId:b.dataset.invite});return}
 if(a==='cancel-group'){act('HOST_CANCEL',{invitationId:b.dataset.invite});return}
 if(a==='reminder'){act('DISMISS_REMINDER',{id:b.dataset.reminder});nav('next');return}
 if(a==='dismiss-reminder'){act('DISMISS_REMINDER',{id:b.dataset.reminder});return}
 if(a==='reset-preview'){$('#presenter').close();openModal('reset');return}
 if(a==='reset'){openedEvent=null;modalState=null;pendingSeals=[];prevStates={};$('#modal').close();$('#presenter').close();$('#confirmation').hidden=true;act('RESET');scrollTo({top:0,behavior:'instant'});toast('Encore 已重新开始。');return}
});
$('#modal').addEventListener('close',function(){modalState=null;playSeal()});$('#presenter').addEventListener('close',playSeal);
[$('#modal'),$('#presenter')].forEach(d=>d.addEventListener('click',function(e){if(e.target!==d)return;var r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom){if(d.id==='modal')closeModal();else d.close()}}));
E.subscribe(()=>{if(!suppress)render()});state().invitations.forEach(i=>prevStates[i.id]=i.state);render();
})();

</script></body></html>
